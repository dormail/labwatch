[project]
name = "labwatch"
version = "0.1.0"
description = "Monitor lab equipment (Bluefors dilution fridges, ...) and send alerts when something goes wrong."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "websockets>=12",
]

[project.scripts]
labwatch = "labwatch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
