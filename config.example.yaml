# labwatch example configuration.
#
#   cp config.example.yaml config.yaml      # config.yaml is git-ignored
#   cp .env.example .env                     # secrets go here, also git-ignored
#
# Secrets (API keys, webhook URLs, tokens, passwords) never go into this file
# directly: write ${VARIABLE} and define VARIABLE in .env or the environment.
# Durations accept seconds or strings like 90s, 5m, 2h, 1d.

state_db: labwatch.sqlite        # relative to this file
history_days: 30                 # keep reading history for a future dashboard
notify_startup: true             # "labwatch started/stopped" info messages
daily_summary: "09:00"           # daily "all OK" message (info severity); remove to disable

# Dead man's switch: labwatch pings this URL every `interval` while it is healthy.
# If the monitoring PC loses power or labwatch crashes, the pings stop and the
# service (e.g. https://healthchecks.io, free) alerts you. Strongly recommended:
# a power outage can take down the monitoring machine too.
heartbeat:
  url: ${HEARTBEAT_URL:-}
  interval: 60

# Defaults for every rule (each rule can override them).
rule_defaults:
  for: 60                # condition must hold this long before alerting
  clear_for: 120         # ... and be healthy this long before "resolved"
  auto_arm: true         # rules only activate after being healthy for arm_after
  arm_after: 10m         #   -> no alarm spam while a fridge is warm / cooling down
  repeat_interval: 2h    # reminder while still firing (0 = never)

# ---------------------------------------------------------------------------
# Where alerts go. Each notifier receives events with severity >= min_severity
# (info < warning < critical). Remove or set `enabled: false` on unused ones.
# Status messages about labwatch itself (started/stopped, "alarms armed", daily
# summary) are delivered regardless of min_severity; `lifecycle: false` turns
# that off for a notifier. Telegram sends them silently.
# Try them with:  labwatch test-notify [name] [--severity critical]
# ---------------------------------------------------------------------------
notifiers:
  - name: console
    type: console

  # Discord bot: one channel per machine; anyone in a channel can /status, /mute, /unmute
  # (see README: Discord). Channel ids: Developer Mode -> right-click channel -> Copy Channel ID.
  - name: discord
    type: discord_bot
    bot_token: ${DISCORD_BOT_TOKEN}
    channels:
      Flash: ${DISCORD_FLASH_CHANNEL}
      Ket: ${DISCORD_KET_CHANNEL}
      Plassys: ${DISCORD_PLASSYS_CHANNEL}
    # status_channel: ${DISCORD_STATUS_CHANNEL}   # optional: "labwatch started/stopped" go here only
    min_severity: warning         # default per channel; /level in a channel changes it
    mention: "@here"              # pinged on critical alerts only (or "<@&ROLE_ID>")

  # Simpler alternative without commands: a webhook posting everything into one channel.
  - name: discord-webhook
    type: discord
    webhook_url: ${DISCORD_WEBHOOK_URL}
    min_severity: info
    enabled: false

  # Telegram: chat_id is the admin. Colleagues message the bot, the admin gets
  # "/approve <id>"; everyone then gets alerts in their own chat with their own /level and /mute.
  - name: telegram
    type: telegram
    bot_token: ${TELEGRAM_BOT_TOKEN}
    chat_id: ${TELEGRAM_CHAT_ID}
    critical_chat_id: ${TELEGRAM_CRITICAL_CHAT_ID:-}  # optional: give this chat a loud custom sound
    silent_below: critical        # warnings arrive silently, critical ones ring
    min_severity: warning

  - name: phone
    type: ntfy                    # https://ntfy.sh push app; urgent priority can bypass Do-Not-Disturb on Android
    topic: ${NTFY_TOPIC}          # pick a long random topic name - it works like a password
    min_severity: critical
    enabled: false

  - name: email
    type: email
    smtp_host: smtp.example.org
    smtp_port: 587
    security: starttls            # starttls | ssl | none
    username: ${SMTP_USER:-}
    password: ${SMTP_PASSWORD:-}
    from: labwatch@example.org
    to: [you@example.org]
    min_severity: critical
    enabled: false

# ---------------------------------------------------------------------------
# Devices. For Bluefors fridges a standard set of channels is built in:
#   T50K T4K Tstill TMXC(mK) P1..P6 flow pulse_tube compressor cpa_alarm(_text)
#   cpa_warning(_text) cooling_water_in/out/dT cpa_oil cpa_helium cpa_motor_current
#   cpa_high_pressure cpa_low_pressure status_text
#   scroll1 scroll2 turbo1 turbo2 ghs_compressor
#   tc400_* / tc4002_* (speed, power, at_speed, overtemp, driver_overtemp) if present
# Add more with `channels:` (find paths with: labwatch discover <device> [prefix]),
# remove defaults with `exclude_channels: [...]`.
# ---------------------------------------------------------------------------
devices:
  - name: Flash
    type: bluefors
    host: ${FLASH_HOST}           # IP/hostname of the PC running the Bluefors control software
    api_key: ${FLASH_API_KEY}     # create a READ-ONLY key in the control software
    port: 49098
    # The control software uses a self-signed certificate. false = don't verify.
    # Better: pin the certificate (see README):  verify_tls: certs/flash.pem
    verify_tls: false
    poll_interval: 30
    unreachable_after: 5m         # alert if the API can't be reached this long
    # fse: true                   # fridge has a Bluefors FSE: read and show its status
    # channels:                   # extra channels: a path from `labwatch discover`, or a computed expr
    #   still_heater_power: {path: mapper.heater_mappings_bftc.device.c.power, unit: W}
    #   p_ratio: {expr: "P3 / P4"}
    # steady_state:               # when anomaly rules learn/alert (this is the built-in default)
    #   conditions: [{channel: T4K, below: 4.5}, {channel: Tstill, below: 1.5}]
    #   for: 6h

    rules: &bluefors_rules
      # --- pulse tube / compressor: what a power or cooling-water failure trips first
      - channel: pulse_tube
        not_equals: 1             # 0 = off, 1 = on, 2 = error
        on_invalid: alarm         # an unreadable value is an alarm too
        severity: critical
        message: Pulse tube is not running! Check power, compressor, cooling water.
      - channel: compressor
        not_equals: 1             # 1 = running
        on_invalid: alarm         # compressor controller lost (e.g. it lost power) is an alarm too
        severity: critical
        message: Compressor stopped. Check power, cooling water, compressor display.
      - channel: cpa_alarm
        not_equals: 0
        severity: critical
        detail_channel: cpa_alarm_text
        for: 0
      - channel: cpa_warning
        not_equals: 0
        severity: warning
        detail_channel: cpa_warning_text
      - channel: cooling_water_in
        above: 298                # K (~25 C); typical Cryomech inlet limit ~27 C
        severity: warning
        message: Cooling water is getting warm - the compressor will trip if it keeps rising.

      # --- temperatures (adjust to your fridge's normal values)
      - channel: T4K
        above: 5                  # K
        hysteresis: 0.3
        severity: critical
      - channel: T4K
        rate_above: 0.05          # K/min, early warning of a warm-up
        window: 10m
        severity: warning
      - channel: T50K
        above: 70                 # K
        hysteresis: 2
        severity: warning

      # --- mixing chamber / still (fast-flux heat spikes are short; `for` ignores them)
      - channel: TMXC
        above: 50                 # mK
        hysteresis: 5
        for: 30m                  # must stay above for 30 min (resets when it drops back)
        severity: warning
      - channel: Tstill
        above: 1.2                # K
        for: 15m
        severity: warning

      # --- gas handling pumps (0 = off, 1 = on, 2 = error)
      - {channel: scroll1, equals: 2, severity: critical, auto_arm: false}
      - {channel: scroll2, equals: 2, severity: critical, auto_arm: false}
      - {channel: turbo1, equals: 2, severity: critical, auto_arm: false}
      - {channel: turbo2, equals: 2, severity: critical, auto_arm: false}
      - {channel: ghs_compressor, equals: 2, severity: critical, auto_arm: false}
      # "stopped": arms only after the pump ran for arm_after, so normally-off pumps never alarm
      - {channel: scroll1, not_equals: 1, severity: warning, message: Circulation scroll pump stopped.}
      - {channel: turbo1, not_equals: 1, severity: warning, message: Circulation turbo pump stopped.}

      # --- turbo controllers (Pfeiffer TC400; ignored on systems that don't expose them)
      - {channel: tc400_overtemp, equals: 1, name: tc400 turbo too hot, severity: warning, auto_arm: false}
      - {channel: tc400_driver_overtemp, equals: 1, name: tc400 controller too hot, severity: warning, auto_arm: false}
      - {channel: tc400_at_speed, not_equals: 1, name: tc400 turbo not at full speed, for: 5m, severity: warning}
      - {channel: tc4002_overtemp, equals: 1, name: tc4002 turbo too hot, severity: warning, auto_arm: false}
      - {channel: tc4002_driver_overtemp, equals: 1, name: tc4002 controller too hot, severity: warning, auto_arm: false}
      - {channel: tc4002_at_speed, not_equals: 1, name: tc4002 turbo not at full speed, for: 5m, severity: warning}

      # --- cooling water (dT = out - in; rising dT = too little water flow)
      - channel: cooling_water_out
        above: 306                # K (~33 C)
        severity: warning
      - channel: cooling_water_dT
        above: 15                 # K
        severity: warning
        message: Cooling water flow through the compressor may be too low.

      # --- anomaly detection: "unusual compared to the last 24 h".
      # Only learns and alerts in the steady state (T4K < 4.5 K and Tstill < 1.5 K for 6 h),
      # so cooldowns, condensing and warm-ups are excluded. Allowed deviation = the given
      # value or 4x the channel's own noise, whichever is larger.
      - &anomaly {channel: cpa_helium, deviation: 5, baseline: 24h, for: 15m, repeat_interval: 0, severity: warning}
      - {<<: *anomaly, channel: cpa_oil, deviation: 4}                # K
      - {<<: *anomaly, channel: cpa_high_pressure, deviation: 5%}
      - {<<: *anomaly, channel: cpa_low_pressure, deviation: 10%}
      - {<<: *anomaly, channel: cpa_motor_current, deviation: 5%}
      - {<<: *anomaly, channel: cooling_water_dT, deviation: 3}       # K
      - {<<: *anomaly, channel: tc400_power, deviation: 25%}
      - {<<: *anomaly, channel: tc4002_power, deviation: 25%}
      - {<<: *anomaly, channel: flow, deviation: 15%}

      # --- data freshness: the temperature controller stopped updating
      - channel: T4K
        max_age: 20m
        severity: warning

  # More fridges reuse the same rules via the YAML anchor:
  # - name: Mercury
  #   type: bluefors
  #   host: ${MERCURY_HOST}
  #   api_key: ${MERCURY_API_KEY}
  #   rules: *bluefors_rules

  # A fake fridge to try notifications end-to-end: the "power fails" after 2 min.
  - name: Simfridge
    type: simulated
    scenario: power_outage        # stable | power_outage | power_outage_pc | unreachable
    outage_after: 2m
    poll_interval: 5
    rule_defaults_note: uses the same rules
    rules: *bluefors_rules
    enabled: false
